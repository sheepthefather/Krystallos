[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/sheepthefather/Krystallos"
authors = ["float_world"]

[workspace.dependencies]
krystallos-core = { path = "crates/krystallos-core" }
krystallos-local = { path = "crates/krystallos-local" }

async-trait = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
