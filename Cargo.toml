[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/sheepthefather/Krystallos"
authors = ["float_world"]

[workspace.dependencies]
krystallos-core = { path = "crates/krystallos-core" }
krystallos-local = { path = "crates/krystallos-local" }

async-trait = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync"] }

[profile.release]
lto = true
codegen-units = 1
# `debuginfo`, not `true`. A full strip removes `.symtab` as well, and UniFFI's
# metadata symbols live there — they are read-only data, not exported dynamic
# symbols, so `.dynsym` does not carry them. With a full strip, `uniffi-bindgen
# generate --library` fails with "No UniFFI metadata found" on the very artifact
# that ships, while succeeding on a debug build, which is a confusing way to
# lose an afternoon.
#
# Keeping `.symtab` also keeps native crash reports symbolisable, and Android's
# own build strips the library again when packaging.
strip = "debuginfo"
