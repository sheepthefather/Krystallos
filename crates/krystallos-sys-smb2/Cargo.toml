[package]
name = "krystallos-sys-smb2"
description = "Raw FFI declarations and vendored build for libsmb2"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
links = "smb2"
build = "build.rs"

[dependencies]

[target.'cfg(windows)'.dependencies]
# For `WSAStartup` and the real `WSADATA` layout. Declaring that struct by hand
# would be guessing at a hundred version-dependent fields we never read.
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock"] }

[build-dependencies]
cmake = "0.1"
dunce = "1"
